name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go · lint · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eprocurement
          POSTGRES_PASSWORD: eprocurement
          POSTGRES_DB: eprocurement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eprocurement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: eprocurement
          MONGO_INITDB_ROOT_PASSWORD: eprocurement
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: eprocurement
          MINIO_ROOT_PASSWORD: eprocurement
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://eprocurement:eprocurement@localhost:5432/eprocurement?sslmode=disable
      TEST_MONGO_URI: mongodb://eprocurement:eprocurement@localhost:27017/?authSource=admin
      TEST_S3_ENDPOINT: localhost:9000
      TEST_S3_ACCESS_KEY: eprocurement
      TEST_S3_SECRET_KEY: eprocurement
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Migrations
        run: |
          go run ./services/identity/cmd/migrate
          go run ./services/identity/cmd/migrate
          go run ./services/procurement/cmd/migrate
          go run ./services/procurement/cmd/migrate

      - name: Test
        run: go test ./...

      - name: Coverage (identity domain, threshold 80%)
        run: |
          go test ./services/identity/... -count=1 \
            -coverprofile=coverage.out \
            -coverpkg=./services/identity/auth,./services/identity/server,./services/identity/config
          go tool cover -func=coverage.out | tail -1
          go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); if ($3+0 < 80) {print "identity coverage "$3"% is below the 80% threshold"; exit 1}}'

  web:
    name: Web · install · build · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
