name: Bug
description: Something is broken or behaves unexpectedly
title: ""
labels: ["type: bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include logs, trace IDs, screenshots
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "local compose · commit sha · tenant/demo data"
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [S1 - data loss/security, S2 - broken flow, S3 - minor]
    validations:
      required: true
